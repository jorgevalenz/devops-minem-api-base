name: CI - DevOps MINEM
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
env:
  DOTNET_VERSION: '8.0.x'
  APP_ENV: ${{ secrets.APP_ENVIRONMENT }}   # secret disponible como variable
jobs:
  build:             # job 1: compila y publica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restaurar dependencias
        run: dotnet restore
      - name: Build Release
        run: dotnet build --configuration Release --no-restore
      - name: Publicar aplicación
        run: |
          dotnet publish src/DevOpsMinem.API \
            --configuration Release \
            --output ./publish
      - name: Upload artefacto de la API
        uses: actions/upload-artifact@v4
        with:
          name: api-release-${{ github.run_number }}
          path: ./publish
          retention-days: 7
  test:              # job 2: tests + cobertura (se define en Fase B)
    needs: build     # espera a que build termine exitosamente
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restaurar dependencias
        run: dotnet restore
      - name: Ejecutar tests con cobertura
        run: |
          dotnet test \
            --configuration Release \
            --no-restore \
            --verbosity normal \
            --collect:'XPlat Code Coverage' \
            --results-directory ./coverage
      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_number }}
          path: ./coverage

  deploy-dev:
    needs: test
    environment: dev
    runs-on: ubuntu-latest   # cambiar a [self-hosted, windows] si hay servidor IIS

    steps:
      - name: Descargar artefacto compilado
        uses: actions/download-artifact@v4
        with:
          name: api-release-${{ github.run_number }}
          path: ./deploy

      - name: Deploy a DEV
        # En ambiente real con IIS, reemplazar por comandos PowerShell:
        # Stop-WebSite -Name ${{ secrets.IIS_SITE_NAME }}
        # robocopy ./deploy ${{ secrets.DEPLOY_PATH }} /MIR
        # Start-WebSite -Name ${{ secrets.IIS_SITE_NAME }}
        run: |
          echo "Iniciando deploy a DEV"
          echo "Artefacto: api-release-${{ github.run_number }}"
          echo "Commit: ${{ github.sha }}"
          echo "Deploy a DEV completado exitosamente"

      - name: Health check DEV
        run: echo "Health check OK en DEV — ${{ secrets.APP_URL }}/health"

  deploy-prod:
    needs: deploy-dev          # necesita deploy-dev
    environment: prod          # pausa el pipeline y notifica al revisor configurado
    runs-on: ubuntu-latest     # cambiar a [self-hosted, windows] si hay servidor IIS
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Descargar artefacto compilado
        uses: actions/download-artifact@v4
        with:
          name: api-release-${{ github.run_number }}
          path: ./deploy

      - name: Deploy a PRODUCCIÓN
        # En ambiente real con IIS, reemplazar por:
        # Stop-WebSite -Name ${{ secrets.IIS_SITE_NAME }}
        # robocopy ./deploy ${{ secrets.DEPLOY_PATH }} /MIR
        # if ($LASTEXITCODE -le 7) { exit 0 }
        # Start-WebSite -Name ${{ secrets.IIS_SITE_NAME }}
        run: |
          echo "=== DEPLOY A PRODUCCIÓN APROBADO ==="
          echo "Artefacto: api-release-${{ github.run_number }}"
          echo "Commit: ${{ github.sha }}"
          echo "Aprobado por revisor del environment prod"
          echo "Deploy a PROD completado exitosamente"

      - name: Health check PRODUCCIÓN
        run: |
          echo "Health check en: ${{ secrets.APP_URL }}/health"
          echo "Aplicación en producción operativa"

      - name: Notificación de éxito
        run: echo "Pipeline CI+CD completo finalizado para commit ${{ github.sha }}"

